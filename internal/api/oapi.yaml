openapi: "3.0.0"
info:
  version: 1.0.0
  title: GitFusion API server
paths:
  /api/v1/repositories:
    get:
      summary: List repositories
      operationId: listRepositories
      tags:
        - Repositories
      parameters:
        - $ref: '#/components/parameters/gitServerParam'
        - $ref: '#/components/parameters/repoOwnerParam'
        - $ref: '#/components/parameters/repoNameQueryParam'
      responses:
        '200':
          description: A list of repositories
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoriesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/v1/repository:
    get:
      summary: Get detailed information for a specific repository
      operationId: getRepository
      tags:
        - Repositories
      parameters:
        - $ref: '#/components/parameters/gitServerParam'
        - $ref: '#/components/parameters/repoOwnerParam'
        - $ref: '#/components/parameters/repoNameParam'
      responses:
        '200':
          description: Detailed information about a repository
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/v1/user/organizations:
    get:
      summary: List organizations for the authenticated user
      operationId: listUserOrganizations
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/gitServerParam'
      responses:
        '200':
          description: A list of organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/v1/branches:
    get:
      summary: List branches for a repository
      operationId: listBranches
      tags:
        - Branches
      parameters:
        - $ref: '#/components/parameters/gitServerParam'
        - $ref: '#/components/parameters/repoOwnerParam'
        - $ref: '#/components/parameters/repoNameParam'
      responses:
        '200':
          description: A list of branches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/v1/trigger-pipeline:
    post:
      summary: Trigger a CI/CD pipeline
      operationId: triggerPipeline
      tags:
        - Pipeline
      parameters:
        - $ref: '#/components/parameters/gitServerParam'
        - name: project
          in: query
          required: true
          description: Project path (e.g., "epmd-edp/temp/sk-test")
          schema:
            type: string
        - name: ref
          in: query
          required: true
          description: Branch/tag/commit (e.g., "main")
          schema:
            type: string
        - name: variables
          in: query
          required: false
          description: JSON array of pipeline variables
          schema:
            type: string
      responses:
        '201':
          description: Pipeline created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/v1/pull-requests:
    get:
      summary: List pull/merge requests for a repository
      operationId: listPullRequests
      tags:
        - PullRequests
      parameters:
        - $ref: '#/components/parameters/gitServerParam'
        - $ref: '#/components/parameters/repoOwnerParam'
        - $ref: '#/components/parameters/repoNameParam'
        - name: state
          in: query
          required: false
          description: Filter by state. Defaults to open.
          schema:
            type: string
            enum: [open, closed, merged, all]
            default: open
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: A list of pull/merge requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PullRequestsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/v1/pipelines:
    get:
      summary: List CI/CD pipelines for a project
      operationId: listPipelines
      tags:
        - Pipeline
      parameters:
        - $ref: '#/components/parameters/gitServerParam'
        - name: project
          in: query
          required: true
          description: Project path (e.g., "epmd-edp/temp/sk-test")
          schema:
            type: string
        - name: ref
          in: query
          required: false
          description: Filter by branch/tag ref
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: Filter by pipeline status
          schema:
            type: string
            enum: [pending, running, success, failed, cancelled, skipped, manual]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: A list of pipelines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelinesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/v1/pipeline-jobs:
    get:
      summary: List jobs for a CI/CD pipeline
      operationId: listPipelineJobs
      tags:
        - Pipeline
      parameters:
        - $ref: '#/components/parameters/gitServerParam'
        - name: project
          in: query
          required: true
          description: Project path (e.g., "krci/my-app")
          schema:
            type: string
        - name: pipelineId
          in: query
          required: true
          description: Pipeline ID
          schema:
            type: string
            pattern: '^[0-9]+$'
      responses:
        '200':
          description: A list of pipeline jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineJobsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/v1/pipeline-job-trace:
    get:
      summary: Get the trace (log) of a CI/CD pipeline job
      operationId: getPipelineJobTrace
      tags:
        - Pipeline
      parameters:
        - $ref: '#/components/parameters/gitServerParam'
        - name: project
          in: query
          required: true
          description: Project path (e.g., "krci/my-app")
          schema:
            type: string
        - name: jobId
          in: query
          required: true
          description: Job ID
          schema:
            type: string
            pattern: '^[0-9]+$'
      responses:
        '200':
          description: The job trace (log)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineJobTraceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'

  /api/v1/cache/invalidate:
    delete:
      summary: Invalidate cache for a specific endpoint
      operationId: invalidateCache
      tags:
        - Cache
      parameters:
        - name: endpoint
          in: query
          required: true
          description: The endpoint name to invalidate cache for (repositories, organizations, branches, pullrequests, pipelines)
          schema:
            type: string
            enum: [repositories, organizations, branches, pullrequests, pipelines]
      responses:
        '200':
          description: Cache invalidated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheInvalidationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    repoNameQueryParam:
      name: repoName
      in: query
      required: false
      description: The name of the repository to search for.
      schema:
        type: string
    gitServerParam:
      name: gitServer
      in: query
      required: true
      description: The Git server name.
      schema:
        type: string
    repoOwnerParam:
      name: owner
      in: query
      required: true
      description: The owner of the repository.
      schema:
        type: string
    repoNameParam:
      name: repoName
      in: query
      required: true
      description: The name of the repository.
      schema:
        type: string
  headers:
    XRequestId:
      description: Request ID; equals the requestId field of the body.
      schema:
        type: string
  responses:
    BadRequest:
      description: A parameter is missing or invalid, or the git server does not support the operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The requested resource was not found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: The git server rejected the credentials stored for it.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: The request could not be completed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Owner:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        avatar_url:
          type: string
      required:
        - id
        - name
    Repository:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        url:
          type: string
        owner:
          type: string
        visibility:
          type: string
          enum: [public, private]
        default_branch:
          type: string
      required:
        - id
        - name
    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
      required:
        - total
    RepositoryDetails:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        url:
          type: string
        ssh_url:
          type: string
        http_url:
          type: string
        owner:
          $ref: '#/components/schemas/Owner'
        visibility:
          type: string
          enum: [public, private]
        created_at:
          type: string
          format: date-time
        default_branch:
          type: string
        forks_count:
          type: integer
        stars_count:
          type: integer
      required:
        - id
        - name
    RepositoriesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Repository'
      required:
        - data
    Problem:
      type: object
      description: RFC 9457 problem details. `detail` never carries the error cause; look the cause up in the server log by `requestId`.
      properties:
        type:
          type: string
          description: Problem type URI. Always `about:blank`.
        title:
          type: string
          description: HTTP status phrase.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Fixed, human-readable explanation.
        requestId:
          type: string
          description: Request ID; equals the X-Request-Id response header and `httpRequest.requestID` in the server log line.
      required:
        - type
        - title
        - status
        - detail
    OrganizationsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Organization'
      required:
        - data
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        avatar_url:
          type: string
      required:
        - id
        - name
    Branch:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    BranchesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Branch'
      required:
        - data
    CacheInvalidationResponse:
      type: object
      properties:
        message:
          type: string
          description: A message indicating the result of the cache invalidation
        endpoint:
          type: string
          description: The endpoint for which cache was invalidated
      required:
        - message
        - endpoint
    PipelineVariable:
      type: object
      properties:
        key:
          type: string
          description: Variable name
        value:
          type: string
          description: Variable value
        variable_type:
          type: string
          enum: [env_var, file]
          description: Type of variable
      required:
        - key
        - value
    PullRequest:
      type: object
      properties:
        id:
          type: string
        number:
          type: integer
        title:
          type: string
        state:
          type: string
          enum: [open, closed, merged]
        author:
          $ref: '#/components/schemas/Owner'
        source_branch:
          type: string
        target_branch:
          type: string
        url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        description:
          type: string
          description: Pull request body text
        draft:
          type: boolean
          description: Whether this pull request is a draft
        commit_sha:
          type: string
          description: Head commit SHA of the source branch
      required:
        - id
        - number
        - title
        - state
        - source_branch
        - target_branch
        - url
        - created_at
        - updated_at
    PullRequestsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PullRequest'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - data
        - pagination
    PipelineResponse:
      type: object
      properties:
        id:
          type: integer
          description: Pipeline ID
        web_url:
          type: string
          description: URL to view pipeline in GitLab UI
        status:
          type: string
          description: Pipeline status
        ref:
          type: string
          description: Branch/tag/commit used
        sha:
          type: string
          description: Commit SHA
      required:
        - id
        - web_url
        - status
        - ref
    Pipeline:
      type: object
      properties:
        id:
          type: string
          description: Pipeline ID (string to accommodate different providers)
        project_id:
          type: string
          description: Project/repository ID
        status:
          type: string
          enum: [pending, running, success, failed, cancelled, skipped, manual]
          description: Normalized pipeline status
        source:
          type: string
          enum: [push, merge_request, schedule, manual, trigger, other]
          description: What triggered the pipeline
        ref:
          type: string
          description: Branch/tag ref
        sha:
          type: string
          description: Commit SHA
        web_url:
          type: string
          description: URL to view pipeline in provider UI
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - status
        - ref
        - sha
        - web_url
        - created_at
    PipelinesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Pipeline'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - data
        - pagination
    PipelineJob:
      type: object
      properties:
        id:
          type: string
          description: Job ID (string to accommodate different providers)
        name:
          type: string
          description: Job name
        stage:
          type: string
          description: Pipeline stage the job belongs to
        status:
          type: string
          description: Job status (provider-native, e.g. success, failed, running, manual)
        ref:
          type: string
          description: Branch/tag ref
        web_url:
          type: string
          description: URL to view the job in the provider UI
        allow_failure:
          type: boolean
          description: Whether the job is allowed to fail without failing the pipeline
        duration:
          type: number
          description: Job duration in seconds
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        failure_reason:
          type: string
          description: Reason the job failed, when applicable
      required:
        - id
        - name
        - stage
        - status
    PipelineJobsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PipelineJob'
      required:
        - data
    PipelineJobTraceResponse:
      type: object
      properties:
        job_id:
          type: string
          description: Job ID the trace belongs to
        content:
          type: string
          description: Raw job trace (log) text
        truncated:
          type: boolean
          description: Whether the trace was truncated due to size limit
      required:
        - job_id
        - content
